name: Deploy GitHub Pages site

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v6

      - name: Checkout QR Generator
        uses: actions/checkout@v6
        with:
          repository: lluisalemanypuig/qr-generator
          ref: main
          path: .qr-generator-source

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .qr-generator-source/package-lock.json

      - name: Install QR Generator dependencies
        working-directory: .qr-generator-source
        run: npm ci

      - name: Build QR Generator
        working-directory: .qr-generator-source
        run: npm run build

      - name: Prepare QR Generator files
        run: |
          rm -rf apps/qr-generator
          mkdir -p apps/qr-generator
          cp -R .qr-generator-source/build/. apps/qr-generator/

      - name: Remove QR Generator source
        run: rm -rf .qr-generator-source

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
